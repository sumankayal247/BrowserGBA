# Builds BrowserGBA and publishes the static site to GitHub Pages.
#
# Why this works without server configuration: GitHub Pages cannot send response
# headers, so a page there is normally NOT cross-origin isolated — and the threaded
# emulator core needs SharedArrayBuffer, which browsers only hand to isolated
# documents. The app's own service worker closes that gap by setting
# Cross-Origin-Opener-Policy and Cross-Origin-Embedder-Policy on the responses it
# answers with, so playback works on Pages too, without any host configuration.
#
# The practical effect on the deployed site: the first visit registers the worker
# and everything except playback is available (library, imports, backups, settings);
# from the second visit — or immediately, via the "Enable playback" button the app
# shows — the emulator runs. Details in docs/DEPLOYMENT.md.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; the newer one wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # Lets the deploy job skip itself instead of failing when Pages is not enabled.
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The type checker and the unit suite gate the deploy: the site is the
      # project's public face, and a red build should never reach it.
      - run: npm run check

      # `sync:core` runs as a prebuild step and vendors the MPL-2.0 mGBA build into
      # public/mgba/, together with its notice and a manifest of what was copied.
      - run: npm run build

      # Creating a Pages site is a repository-admin action: a workflow token is
      # refused by `POST /repos/{owner}/{repo}/pages` with "Resource not accessible by
      # integration", and `configure-pages` (even with enablement) fails with it. That
      # is a one-time repository setting, not a defect in this project, so ask first
      # and stop with an explanation instead of turning every push on `main` red.
      - id: pages
        name: Check whether Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Pages is not enabled::This repository has no GitHub Pages site, and only a repository admin can create one. Set Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow. Everything else in this run — install, tests, build — passed; the site was not published."
          fi

      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
